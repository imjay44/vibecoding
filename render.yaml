services:
  - type: web
    name: homeserve-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.db.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "HomeServe Technologies API"
      - key: DATABASE_URL
        value: sqlite:///./homeserve.db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: "*"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        value: sec_test_placeholder
      - key: RAZORPAY_WEBHOOK_SECRET
        value: whsec_test_placeholder
      - key: CLOUDINARY_CLOUD_NAME
        value: homeserve_placeholder
      - key: CLOUDINARY_API_KEY
        value: "123456789012345"
      - key: CLOUDINARY_API_SECRET
        value: sec_placeholder_1234567890
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RAG_PDF_PATH
        value: ragbased.pdf
